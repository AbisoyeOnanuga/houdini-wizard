[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-wizard"
version = "0.1.0"
description = "Houdini shelf card that quotes one section from the help installed with this Houdini."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.11"]

[project.scripts]
houdini-wizard-worker = "houdini_wizard.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]
